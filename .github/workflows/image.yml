name: image

# Builds the ListHoard image and pushes it to GHCR on every version tag. The
# quickstart compose pins this image (see the manifest's image_swap gate) —
# until the tag lands, that pin is unfulfillable, so the flag flips in the
# same change as the tag.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  build-push:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: |
            ghcr.io/whispersofj/listhoard:latest
            ghcr.io/whispersofj/listhoard:${{ github.ref_name }}
